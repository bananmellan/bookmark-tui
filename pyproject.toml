[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-tui"
version = "0.1.0"
description = "Fast terminal TUI for managing bookmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
bookmark-tui = "bookmark_tui.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bookmark_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
